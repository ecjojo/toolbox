<meta content="width=device-width, initial-scale=1" name="viewport"/><meta content="dark" name="color-scheme"/><meta content="#111417" name="theme-color"/>

<meta content="Emoji, symbols, cute fonts toolkit by ecjojo." name="description"/>

<!-- App CSS -->
<link href="styles.css" rel="stylesheet"/><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"/>
<link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B0%3C/text%3E%3C/svg%3E" rel="icon">

<body>
<main class="page-wrap" role="main">
<section aria-label="toolbox" class="card-shell">
<!-- Toolbar / Tabs (only: ᴇᴍᴏᴊɪ / ꜱʏᴍʙᴏʟ / ꜰᴏɴᴛ) -->
<div aria-label="工具切換" class="toolbar" role="tablist">
<button aria-controls="panel-emoji" aria-selected="true" class="toggle-button" id="tab-emoji" role="tab" tabindex="0" type="button">ᴇᴍᴏᴊɪ</button>
<button aria-controls="panel-kaomoji" aria-selected="false" class="toggle-button" id="tab-kaomoji" role="tab" tabindex="-1" type="button">ᴋᴀᴏᴍᴏᴊɪ</button>
<button aria-controls="panel-symbol" aria-selected="false" class="toggle-button" id="tab-symbol" role="tab" tabindex="-1" type="button">ꜱʏᴍʙᴏʟ</button>
<button aria-controls="panel-font" aria-selected="false" class="toggle-button" id="tab-font" role="tab" tabindex="-1" type="button">ꜰᴏɴᴛ</button>
</div>
<!-- Panels -->
<div class="content-container">
<!-- Emoji Book -->
<section aria-label="emoji book" aria-labelledby="tab-emoji" class="toggle-content active book-panel" id="panel-emoji" role="tabpanel">
<hr/>
<h5 class="section-title">ᴇᴍᴏᴊɪ ʙᴏᴏᴋ⁵</h5>
<div aria-live="polite" id="recent-emojis"></div>
<div id="emoji-book"></div>
</section>
<section aria-label="kaomoji book" aria-labelledby="tab-kaomoji" class="toggle-content book-panel" hidden="" id="panel-kaomoji" role="tabpanel">
<hr/>
<h5 class="section-title">ᴋᴀᴏᴍᴏᴊɪ ʙᴏᴏᴋ</h5>
<div aria-live="polite" id="recent-kaomojis"></div>
<div id="kaomoji-book"></div>
</section>
<!-- Symbol Book -->
<section aria-label="symbol book" aria-labelledby="tab-symbol" class="toggle-content book-panel" hidden="" id="panel-symbol" role="tabpanel">
<hr/>
<h5 class="section-title">ꜱʏᴍʙᴏʟ ʙᴏᴏᴋ</h5>
<div aria-live="polite" id="recent-symbols"></div>
<div id="symbol-book"></div>
</section>
<!-- Cute Font Generator -->
<section aria-label="cute font generator" aria-labelledby="tab-font" class="toggle-content" hidden="" id="panel-font" role="tabpanel">
<hr/>
<h5 class="section-title">ᴄᴜᴛᴇ ꜰᴏɴᴛ ɢᴇɴᴇʀᴀᴛᴏʀ</h5>
<!-- 輸入框 -->
<textarea aria-label="Input text to convert into cute font" autocapitalize="off" autocomplete="off" class="form-control dark-textarea fancytext" placeholder="Type or paste text here..." rows="3" spellcheck="false"></textarea>
<!-- 預覽與複製 -->
<div class="mt-3" id="result">
<div class="input-group mb-3">
<input aria-live="polite" class="form-control dark-input text-9" id="copy_8" readonly="" type="text" value="ᴘʀᴇᴠɪᴇᴡ ᴛᴇxᴛ"/>
<div class="input-group-append">
<button aria-label="Copy converted text" class="input-group-text copybutton" data-clipboard-action="copy" data-clipboard-target="#copy_8" type="button">
                                    Copy
                                </button>
</div>
</div>
</div>
</section>
</div>
<hr/>
<!-- Socials -->
<div class="container text-center">
<nav aria-label="social links" class="socials">
<a aria-label="Twitter" data-hover="twitter" href="https://twitter.com/ecjojoDEV"><i aria-hidden="true" class="fa fa-twitter fa-lg"></i><span class="sr-only">Twitter</span></a>
<a aria-label="YouTube" data-hover="youtube" href="https://www.youtube.com/@ecjojoDEV"><i aria-hidden="true" class="fa fa-youtube-play fa-lg"></i><span class="sr-only">YouTube</span></a>
<a aria-label="GitHub" data-hover="github" href="https://github.com/ecjojo"><i aria-hidden="true" class="fa fa-github fa-lg"></i><span class="sr-only">GitHub</span></a>
<a aria-label="Discord" data-hover="discord" href="https://discord.gg/2uFuM9UjEJ"><i aria-hidden="true" class="fa fa-comments fa-lg"></i><span class="sr-only">Discord</span></a>
<a aria-label="LinkedIn" data-hover="linkedin" href="https://www.linkedin.com/in/ecjojo/"><i aria-hidden="true" class="fa fa-linkedin fa-lg"></i><span class="sr-only">LinkedIn</span></a>
</nav>
</div>
<footer>© 2024-<span id="current-year"></span> <a href="https://ecjojo.github.io/">ecjojo studio</a></footer>

</main>
<!-- Local scripts (kept only needed ones) -->
<script defer="" src="js/clipboard.js"></script>
<script defer="" src="js/fonts.js"></script>
<script defer="" src="js/preview.js"></script>
<script defer="" src="js/copybutton.js"></script>
<script defer="" src="js/tooldisplay.js"></script>
<!-- Progressive enhancement for tabs -->
<script type="module">
document.addEventListener('DOMContentLoaded', () => {
  const buttons = Array.from(document.querySelectorAll('.toggle-button'));
  const panels = Array.from(document.querySelectorAll('.toggle-content'));
  const toolbar = document.querySelector('.toolbar');
  const year = document.querySelector('#current-year');

  if (year) year.textContent = String(new Date().getFullYear());

  const loaders = {
    'emoji book': () => import('./js/emojibook.js'),
    'kaomoji book': () => import('./js/kaomojibook.js'),
    'symbol book': () => import('./js/symbolbook.js'),
    'cute font generator': () => Promise.resolve()
  };

  const loaded = new Set();
  const loading = new Map();

  function mountPanel(label) {
    if (label === 'emoji book' && window.emojiBook?.mount) {
      window.emojiBook.mount();
    }
  }

  function unmountPanel(label) {
    if (label === 'emoji book' && window.emojiBook?.unmount) {
      window.emojiBook.unmount();
    }
  }

  function clearLoadError(panel) {
    panel.querySelector('.panel-load-error')?.remove();
  }

  function showLoadError(panel) {
    clearLoadError(panel);
    const message = document.createElement('p');
    message.className = 'panel-load-error';
    message.setAttribute('role', 'status');
    message.textContent = '載入失敗，請再按一次分頁重試。';
    panel.prepend(message);
  }

  async function ensureLoaded(idx) {
    const panel = panels[idx];
    if (!panel) return;

    const label = panel.getAttribute('aria-label');
    if (!label) return;

    if (loaded.has(label)) {
      if (panel.classList.contains('active')) mountPanel(label);
      return;
    }

    if (loading.has(label)) {
      try {
        await loading.get(label);
      } catch {
        return;
      }
      return;
    }

    const loader = loaders[label];
    if (!loader) return;

    const promise = loader()
      .then(() => {
        loaded.add(label);
        clearLoadError(panel);
        if (panel.classList.contains('active')) mountPanel(label);
      })
      .catch((error) => {
        console.error(`Failed to load panel: ${label}`, error);
        showLoadError(panel);
        throw error;
      })
      .finally(() => {
        loading.delete(label);
      });

    loading.set(label, promise);

    try {
      await promise;
    } catch {
      // Keep the panel retryable. A later click will try the import again.
    }
  }

  function activate(idx, { focus = false } = {}) {
    if (idx < 0 || idx >= panels.length) return;

    const currentActive = panels.findIndex((panel) => panel.classList.contains('active'));
    if (currentActive !== -1 && currentActive !== idx) {
      const currentLabel = panels[currentActive].getAttribute('aria-label');
      unmountPanel(currentLabel);
    }

    buttons.forEach((button, i) => {
      const active = i === idx;
      button.setAttribute('aria-selected', String(active));
      button.tabIndex = active ? 0 : -1;
    });

    panels.forEach((panel, i) => {
      const active = i === idx;
      panel.classList.toggle('active', active);
      panel.hidden = !active;
    });

    if (focus) buttons[idx]?.focus();

    const label = panels[idx].getAttribute('aria-label');
    if (loaded.has(label)) {
      mountPanel(label);
    } else {
      void ensureLoaded(idx);
    }
  }

  buttons.forEach((button, i) => {
    button.addEventListener('click', () => activate(i));
  });

  toolbar?.addEventListener('keydown', (event) => {
    const current = document.activeElement;
    const idx = buttons.indexOf(current);
    if (idx < 0) return;

    let nextIdx = null;

    if (event.key === 'ArrowRight') nextIdx = (idx + 1) % buttons.length;
    if (event.key === 'ArrowLeft') nextIdx = (idx - 1 + buttons.length) % buttons.length;
    if (event.key === 'Home') nextIdx = 0;
    if (event.key === 'End') nextIdx = buttons.length - 1;

    if (nextIdx !== null) {
      event.preventDefault();
      activate(nextIdx, { focus: true });
    }
  });

  activate(0);
});
</script>
</body>
</html>

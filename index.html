<style id="persistent-book-layout">
/* Retained book: populate once, let native CSS grid handle every viewport width. */
.persistent-book{--book-cell-min:40px;min-width:0}
.persistent-book[data-book-mode="symbol"]{--book-cell-min:48px}
.persistent-book-section{contain:layout style}
.persistent-book-heading{display:flex;align-items:flex-end;min-height:40px;margin:0;padding:0 0 5px}
.persistent-book-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--book-cell-min)),1fr));
  grid-auto-rows:34px;
  gap:6px;
  align-items:center;
  min-width:0;
}
.persistent-book-grid > .emoji,
.persistent-book-grid > .symbol{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-width:0;
  height:34px;
  margin:0;
  padding:0 2px;
  border:0;
  background:transparent;
  color:inherit;
  white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.persistent-book-grid > .emoji{font-size:22px}
.persistent-book-grid > .symbol{font-size:16px}
.persistent-book-grid > .book-cell-wide{grid-column:span 2}
/* Wheel scrolling moves the pointer over many cells. Keep feedback immediate
   so these cells do not start overlapping transform/filter animations. */
.book-panel .emoji,.book-panel .symbol,.book-panel .kaomoji{transition:none}
.book-panel .emoji:hover,.book-panel .emoji:active,
.book-panel .symbol:hover,.book-panel .symbol:active,
.book-panel .kaomoji:hover,.book-panel .kaomoji:active{transform:none;filter:none}
.persistent-book-grid > .emoji:hover,
.persistent-book-grid > .symbol:hover{background:#20262c}
</style>

<!-- Progressive enhancement for tabs -->
<script type="module">
document.addEventListener('DOMContentLoaded', () => {
  const buttons = Array.from(document.querySelectorAll('.toggle-button'));
  const panels = Array.from(document.querySelectorAll('.toggle-content'));
  const toolbar = document.querySelector('.toolbar');
  const year = document.querySelector('#current-year');

  if (year) year.textContent = String(new Date().getFullYear());

  const loaders = {
    'emoji book': () => import('./js/emojibook.js?v=retain-20261024'),
    'kaomoji book': () => import('./js/kaomojibook.js'),
    'symbol book': () => import('./js/symbolbook.js?v=lean-assets-20261024'),
    'cute font generator': () => import('./js/fonts.js?v=lean-assets-20261024').then(module => module.mountFontTool())
  };

  const loaded = new Set();
  const loading = new Map();

  function panelController(label) {
    if (label === 'emoji book') return window.emojiBook;
    if (label === 'symbol book') return window.symbolBook;
    return null;
  }

  function mountPanel(label) {
    panelController(label)?.mount?.();
  }

  function unmountPanel(label) {
    panelController(label)?.unmount?.();
  }

  function clearLoadError(panel) {
    panel.querySelector('.panel-load-error')?.remove();
  }

  function showLoadError(panel) {
    clearLoadError(panel);
    const message = document.createElement('p');
    message.className = 'panel-load-error';
    message.setAttribute('role', 'status');
    message.textContent = '載入失敗，請再按一次分頁重試。';
    panel.prepend(message);
  }

  async function ensureLoaded(idx) {
    const panel = panels[idx];
    if (!panel) return;

    const label = panel.getAttribute('aria-label');
    if (!label) return;

    if (loaded.has(label)) {
      if (panel.classList.contains('active')) mountPanel(label);
      return;
    }

    if (loading.has(label)) {
      try {
        await loading.get(label);
      } catch {
        return;
      }
      return;
    }

    const loader = loaders[label];
    if (!loader) return;

    const promise = loader()
      .then(() => {
        loaded.add(label);
        clearLoadError(panel);
        if (panel.classList.contains('active')) mountPanel(label);
      })
      .catch((error) => {
        console.error(`Failed to load panel: ${label}`, error);
        showLoadError(panel);
        throw error;
      })
      .finally(() => {
        loading.delete(label);
      });

    loading.set(label, promise);

    try {
      await promise;
    } catch {
      // Keep the panel retryable. A later click will try the import again.
    }
  }

  function activate(idx, { focus = false } = {}) {
    if (idx < 0 || idx >= panels.length) return;

    const currentActive = panels.findIndex((panel) => panel.classList.contains('active'));
    if (currentActive !== -1 && currentActive !== idx) {
      const currentLabel = panels[currentActive].getAttribute('aria-label');
      unmountPanel(currentLabel);
    }

    buttons.forEach((button, i) => {
      const active = i === idx;
      button.setAttribute('aria-selected', String(active));
      button.tabIndex = active ? 0 : -1;
    });

    panels.forEach((panel, i) => {
      const active = i === idx;
      panel.classList.toggle('active', active);
      panel.hidden = !active;
    });

    if (focus) buttons[idx]?.focus();

    const label = panels[idx].getAttribute('aria-label');
    if (loaded.has(label)) {
      mountPanel(label);
    } else {
      void ensureLoaded(idx);
    }
  }

  buttons.forEach((button, i) => {
    button.addEventListener('click', () => activate(i));
  });

  toolbar?.addEventListener('keydown', (event) => {
    const current = document.activeElement;
    const idx = buttons.indexOf(current);
    if (idx < 0) return;

    let nextIdx = null;

    if (event.key === 'ArrowRight') nextIdx = (idx + 1) % buttons.length;
    if (event.key === 'ArrowLeft') nextIdx = (idx - 1 + buttons.length) % buttons.length;
    if (event.key === 'Home') nextIdx = 0;
    if (event.key === 'End') nextIdx = buttons.length - 1;

    if (nextIdx !== null) {
      event.preventDefault();
      activate(nextIdx, { focus: true });
    }
  });

  activate(0);
});
</script>
